<h2>Confirme seu e-mail</h2>
<p>Use o botão abaixo para confirmar seu e-mail e entrar no ListaCerta. O link e o código valem por 15 minutos e só podem ser usados uma vez.</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:12px 20px;background:#0B6B4A;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600">Confirmar e entrar</a></p>
<p>Ou digite este código na tela de entrada:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p>Se você não pediu este e-mail, ignore esta mensagem.</p>
